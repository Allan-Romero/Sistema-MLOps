# Entorno desechable: sin puertos públicos, .env del usuario ni volúmenes de producción.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?Defina una clave efimera}
      POSTGRES_DB: mlops_ci
    volumes:
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/database/migrations/001_unique_active_model.sql:/docker-entrypoint-initdb.d/02-active.sql:ro
      - ./src/database/migrations/002_promotion_decisions.sql:/docker-entrypoint-initdb.d/03-promotion.sql:ro
      - ./src/database/migrations/003_real_labels_for_rollback.sql:/docker-entrypoint-initdb.d/04-labels.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ci -d mlops_ci']
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD}
      POSTGRES_DB: mlops_ci
      MLOPS_E2E_ISOLATED: '1'
      PYTHONPATH: /app
    volumes:
      - ci_models:/app/models
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD}
      POSTGRES_DB: mlops_ci
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  ci_models:
